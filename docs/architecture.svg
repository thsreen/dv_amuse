<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrowLLM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1f2430; }
      .sub { font-size: 13px; fill: #4c566a; }
      .h { font-size: 15px; font-weight: 700; fill: #1f2430; }
      .hs { font-size: 13px; font-weight: 700; fill: #1f2430; }
      .t { font-size: 12px; fill: #2e3440; }
      .ts { font-size: 11px; fill: #2e3440; }
      .m { font-size: 11px; fill: #4c566a; font-family: Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .lane { font-size: 12px; font-weight: 700; fill: #4c566a; letter-spacing: 1px; }
      .stage { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.5; }
      .step { fill: #ffffff; stroke: #4a6fa5; stroke-width: 1.2; }
      .art { fill: #f6f7f9; stroke: #a0a8b6; stroke-width: 1; }
      .llm { fill: #f1ebfb; stroke: #5e35b1; stroke-width: 1.5; }
      .check { fill: #fff4e5; stroke: #d9822b; stroke-width: 1.5; }
      .trace { fill: #e9f6ef; stroke: #2e8b57; stroke-width: 1.5; }
      .human { fill: #fdecec; stroke: #c0392b; stroke-width: 1.5; }
      .flow { stroke: #3b4252; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #8a93a3; stroke-width: 1; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrow); }
      .bus { stroke: #5e35b1; stroke-width: 1.1; fill: none; stroke-dasharray: 5 4; }
      .call { stroke: #5e35b1; stroke-width: 1.1; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowLLM); }
      .badge { font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="1120" fill="#ffffff"/>
  <text x="30" y="40" class="title">dv_agent architecture: specification-driven verification test plan</text>
  <text x="30" y="62" class="sub">Fixed step order (D-014). The model does the semantic work inside each step; checks outside it refuse</text>
  <text x="30" y="79" class="sub">and the model repairs (D-015). Specification only (D-008). Human review is authoritative.</text>

  <text x="30" y="104" class="lane">ARTIFACTS (runs/&lt;repo&gt;/)</text>
  <text x="330" y="104" class="lane">PIPELINE (fixed order)</text>
  <text x="960" y="104" class="lane">CROSS-CUTTING</text>

  <!-- Inputs -->
  <rect x="330" y="114" width="580" height="52" rx="8" class="art"/>
  <text x="346" y="136" class="h">Inputs</text>
  <text x="420" y="136" class="t">Design repository: spec documents (PDF, DOCX, HTML, MD, text)</text>
  <text x="420" y="154" class="t">Test-plan template: JSON sections, generators, queries</text>

  <!-- 1 Ingest -->
  <rect x="330" y="186" width="580" height="96" rx="8" class="stage"/>
  <text x="346" y="208" class="h">1  Ingest</text>
  <text x="900" y="208" class="m" text-anchor="end">ingest.py</text>
  <text x="346" y="230" class="t">Discover spec files; skip design-source, bench and tool-output folders</text>
  <text x="346" y="248" class="t">Extract pages, strip running headers/footers, detect headings</text>
  <text x="346" y="266" class="t">Chunk by section with exact character offsets, pages and SHA-256</text>
  <path d="M620,166 L620,184" class="flow"/>

  <!-- 2 Graph build -->
  <rect x="330" y="302" width="580" height="128" rx="8" class="stage"/>
  <text x="346" y="324" class="h">2  Graph build</text>
  <text x="838" y="324" class="m" text-anchor="end">graph.py extract.py community.py dense.py</text>
  <rect x="852" y="311" width="50" height="18" rx="9" fill="#5e35b1"/><text x="864" y="324" class="badge">LLM</text>
  <text x="346" y="346" class="t">L1 chunks (immutable); L3 documents and sections (navigation only)</text>
  <text x="346" y="364" class="t">L2 requirements and entities from the model, each quote found verbatim;</text>
  <text x="346" y="380" class="t">entities qualified by their owner (register.field)</text>
  <text x="346" y="398" class="t">Dependency edges from the model, each with a verbatim evidence quote</text>
  <text x="346" y="416" class="t">Deterministic communities (L3); optional dense NumPy index</text>
  <path d="M620,282 L620,300" class="flow"/>

  <!-- 3 Retrieval -->
  <rect x="330" y="450" width="580" height="104" rx="8" class="stage"/>
  <text x="346" y="472" class="h">3  Retrieval and fetch</text>
  <text x="900" y="472" class="m" text-anchor="end">retrieval.py testplan_context.py planning.py</text>
  <text x="346" y="494" class="t">Seeds: BM25 + dense, fused; Personalized PageRank over typed edges</text>
  <text x="346" y="512" class="t">Evidence is always an L1 chunk, with scores and an explained path</text>
  <text x="346" y="530" class="t">Cited context bundles; rerank + sufficiency multi-hop</text>
  <path d="M620,430 L620,448" class="flow"/>

  <!-- 4 Specification steps -->
  <rect x="330" y="574" width="580" height="184" rx="8" class="stage"/>
  <text x="346" y="596" class="h">4  Specification steps</text>
  <rect x="852" y="583" width="50" height="18" rx="9" fill="#5e35b1"/><text x="864" y="596" class="badge">LLM</text>
  <rect x="346" y="610" width="270" height="66" rx="6" class="step"/>
  <text x="358" y="630" class="hs">a  Interfaces</text>
  <text x="606" y="630" class="m" text-anchor="end">interfaces.py</text>
  <text x="358" y="648" class="t">Signals grouped by functionality</text>
  <text x="358" y="664" class="t">and connected module type</text>
  <rect x="624" y="610" width="270" height="66" rx="6" class="step"/>
  <text x="636" y="630" class="hs">b  Register map</text>
  <text x="884" y="630" class="m" text-anchor="end">registers.py</text>
  <text x="636" y="648" class="t">Records verified and merged;</text>
  <text x="636" y="664" class="t">conflicts kept; writable fields</text>
  <rect x="346" y="690" width="548" height="58" rx="6" class="step"/>
  <text x="358" y="710" class="hs">c  Verification strategy</text>
  <text x="884" y="710" class="m" text-anchor="end">strategy.py</text>
  <text x="358" y="727" class="t">Agents per interface group: drives, monitors, registers, sequences,</text>
  <text x="358" y="742" class="t">correctness; scoreboards, register model; checked against a and b</text>
  <path d="M481,676 L481,688" class="flow"/>
  <path d="M759,676 L759,688" class="flow"/>
  <path d="M620,554 L620,572" class="flow"/>

  <!-- 5 Test plan -->
  <rect x="330" y="778" width="580" height="172" rx="8" class="stage"/>
  <text x="346" y="800" class="h">5  Template-driven test plan</text>
  <text x="838" y="800" class="m" text-anchor="end">testplan_doc.py</text>
  <rect x="852" y="787" width="50" height="18" rx="9" fill="#5e35b1"/><text x="864" y="800" class="badge">LLM</text>
  <text x="346" y="822" class="t">1  Title (no model call)</text>
  <text x="620" y="822" class="t">2  Feature description</text>
  <text x="346" y="840" class="t">3  Register map (from 4b)</text>
  <text x="620" y="840" class="t">4  Strategy (from 4c)</text>
  <text x="346" y="858" class="t">5  Configurations: every writable field, spec-stated values</text>
  <text x="346" y="876" class="t">6  Stimulus   7  Checks   8  Coverage   9  Callouts</text>
  <text x="346" y="894" class="t">10  Assumptions (all ASSUMED)   11  Designer questions</text>
  <text x="346" y="916" class="t">Each entry: DOCUMENTED / INFERRED / ASSUMED + checked citations;</text>
  <text x="346" y="932" class="t">later sections see earlier ones; interface groups feed every section</text>
  <path d="M620,758 L620,776" class="flow"/>

  <!-- 6 Human review -->
  <rect x="330" y="970" width="580" height="66" rx="8" class="human"/>
  <text x="346" y="992" class="h">6  Human review (authoritative)</text>
  <text x="346" y="1010" class="t">Designer questions: spec conflicts, gaps, unresolved repairs</text>
  <text x="346" y="1026" class="t">Everything stays NEEDS_REVIEW until an engineer signs off (planned)</text>
  <path d="M620,950 L620,968" class="flow"/>

  <!-- Artifacts column -->
  <rect x="30" y="186" width="270" height="96" rx="8" class="art"/>
  <text x="44" y="208" class="hs">Ingest outputs</text>
  <text x="44" y="228" class="m">manifest.json (status, reason)</text>
  <text x="44" y="246" class="m">text/&lt;doc&gt;.txt (cleaned text)</text>
  <text x="44" y="264" class="m">chunks.jsonl (offsets, pages)</text>
  <path d="M328,234 L302,234" class="thin"/>

  <rect x="30" y="302" width="270" height="128" rx="8" class="art"/>
  <text x="44" y="324" class="hs">Graph outputs</text>
  <text x="44" y="344" class="m">graph.json (node-link)</text>
  <text x="44" y="362" class="m">build_stats.json (mode, counts)</text>
  <text x="44" y="380" class="m">dense/ (vectors, index)</text>
  <text x="44" y="398" class="m">llm_cache/ (by prompt hash)</text>
  <text x="44" y="418" class="ts">reused unless inputs or model change</text>
  <path d="M328,366 L302,366" class="thin"/>

  <rect x="30" y="450" width="270" height="104" rx="8" class="art"/>
  <text x="44" y="472" class="hs">Fetch outputs</text>
  <text x="44" y="492" class="m">dv-agent query/context/features</text>
  <text x="44" y="510" class="m">bundles: requirements, preconditions,</text>
  <text x="44" y="526" class="m">  evidence, open items</text>
  <text x="44" y="544" class="m">test_plan.json (per requirement)</text>
  <path d="M328,502 L302,502" class="thin"/>

  <rect x="30" y="574" width="270" height="184" rx="8" class="art"/>
  <text x="44" y="596" class="hs">Step outputs</text>
  <text x="44" y="616" class="m">interfaces.json / .md</text>
  <text x="44" y="634" class="m">registers.json / .md</text>
  <text x="44" y="652" class="m">strategy.json / .md</text>
  <text x="44" y="676" class="ts">The strategy step reads the saved</text>
  <text x="44" y="692" class="ts">interface and register outputs,</text>
  <text x="44" y="708" class="ts">regenerates them only when missing</text>
  <text x="44" y="724" class="ts">or stale, and records their trace IDs</text>
  <path d="M328,666 L302,666" class="thin"/>

  <rect x="30" y="778" width="270" height="172" rx="8" class="art"/>
  <text x="44" y="800" class="hs">Test-plan outputs</text>
  <text x="44" y="820" class="m">testplan_doc.json (citations,</text>
  <text x="44" y="836" class="m">  lineage IDs)</text>
  <text x="44" y="854" class="m">testplan_doc.md (readable)</text>
  <text x="44" y="876" class="ts">Graph artifact per section:</text>
  <text x="44" y="892" class="m">TPS-* test_plan_section,</text>
  <text x="44" y="908" class="m">  interface_definitions,</text>
  <text x="44" y="924" class="m">  register_map</text>
  <text x="44" y="942" class="ts">lineage &lt;id&gt; walks back to chunks</text>
  <path d="M328,864 L302,864" class="thin"/>

  <!-- Cross-cutting -->
  <rect x="960" y="114" width="250" height="232" rx="8" class="llm"/>
  <text x="976" y="138" class="h">Meta Model API</text>
  <text x="976" y="156" class="m">llm.py dense.py</text>
  <text x="976" y="178" class="t">OpenAI Python SDK</text>
  <text x="976" y="194" class="t">base URL api.meta.ai/v1</text>
  <text x="976" y="212" class="t">muse-spark-1.3, Responses API</text>
  <text x="976" y="228" class="t">text.format json_schema</text>
  <text x="976" y="248" class="t">Bounded retries; errors</text>
  <text x="976" y="264" class="t">classified without details</text>
  <text x="976" y="284" class="t">Cache keyed by prompt hash</text>
  <text x="976" y="304" class="m">--llm auto | on | off</text>
  <text x="976" y="324" class="t">FakeLLM in offline tests</text>

  <rect x="960" y="366" width="250" height="250" rx="8" class="check"/>
  <text x="976" y="390" class="h">Refuse and repair</text>
  <text x="976" y="408" class="m">repair.py</text>
  <text x="976" y="430" class="t">1  The model answers</text>
  <text x="976" y="448" class="t">2  Checks outside the model:</text>
  <text x="976" y="464" class="t">    quotes, values, citations,</text>
  <text x="976" y="480" class="t">    coverage, drive direction</text>
  <text x="976" y="498" class="t">3  Refused: previous output +</text>
  <text x="976" y="514" class="t">    reasons back to the model</text>
  <text x="976" y="532" class="t">4  Repeat, at most</text>
  <text x="976" y="548" class="m">    DV_AGENT_MAX_REPAIRS=2</text>
  <text x="976" y="568" class="t">Spec conflicts never refused;</text>
  <text x="976" y="584" class="t">leftovers become questions</text>
  <text x="976" y="604" class="ts">Steps 4 and 5 (not yet step 2)</text>

  <rect x="960" y="636" width="250" height="172" rx="8" class="trace"/>
  <text x="976" y="660" class="h">Tracing and lineage</text>
  <text x="976" y="678" class="m">trace.py graph.py</text>
  <text x="976" y="700" class="t">One trace per run; spans for</text>
  <text x="976" y="716" class="t">steps, model calls, refusals</text>
  <text x="976" y="736" class="t">trace.jsonl always written</text>
  <text x="976" y="752" class="t">Langfuse mirror with keys;</text>
  <text x="976" y="768" class="t">its failure never stops a run</text>
  <text x="976" y="788" class="t">Artifacts keep fact and chunk IDs</text>

  <rect x="960" y="828" width="250" height="122" rx="8" class="art"/>
  <text x="976" y="852" class="h">Reuse and control</text>
  <text x="976" y="874" class="t">Each stage is reused when its</text>
  <text x="976" y="890" class="t">inputs, model and graph match</text>
  <text x="976" y="912" class="m">--force  rerun a stage</text>
  <text x="976" y="930" class="m">--fresh  clear cache, rerun</text>

  <!-- Model-call bus -->
  <path d="M902,320 L935,320" class="bus"/>
  <path d="M902,592 L935,592" class="bus"/>
  <path d="M902,796 L935,796" class="bus"/>
  <path d="M935,796 L935,230" class="bus"/>
  <path d="M935,230 L958,230" class="call"/>

  <!-- Legend -->
  <rect x="30" y="1058" width="1180" height="44" rx="8" fill="#fafbfc" stroke="#d8dee9"/>
  <rect x="46" y="1072" width="16" height="16" class="stage"/><text x="68" y="1085" class="t">pipeline stage</text>
  <rect x="190" y="1072" width="16" height="16" class="art"/><text x="212" y="1085" class="t">artifact / control</text>
  <rect x="350" y="1072" width="16" height="16" class="llm"/><text x="372" y="1085" class="t">model API</text>
  <rect x="470" y="1072" width="16" height="16" class="check"/><text x="492" y="1085" class="t">check outside the model</text>
  <rect x="670" y="1072" width="16" height="16" class="trace"/><text x="692" y="1085" class="t">trace / lineage</text>
  <rect x="810" y="1072" width="16" height="16" class="human"/><text x="832" y="1085" class="t">human decision</text>
  <path d="M960,1080 L1000,1080" class="call"/><text x="1008" y="1085" class="t">calls the model</text>
</svg>
