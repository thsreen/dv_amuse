<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 320" role="img" aria-label="The contract, plan and interface are validated and rendered through fixed templates, then compiled with the RTL and simulated. Changed inputs, a missing simulator or too few scoreboard comparisons give BLOCKED, never PASS."><style>:root{--bg:#f2f6f7;--panel:#ffffff;--fg:#14232a;--muted:#51646d;--rule:#c7d3d8;--line:#3b4e57;
--ok:#006b66;--okbg:#def1ef;--mod:#5a3db3;--modbg:#ece8fa;--gap:#9c5300;--gapbg:#fbefdc;--stop:#a8262c;--stopbg:#fbe6e6;
--disp:Arial,Helvetica,sans-serif;--body:Arial,Helvetica,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f171b;--panel:#172329;--fg:#e2ebee;--muted:#9bb0b8;--rule:#2d3e46;--line:#9fb5be;
--ok:#55d1c5;--okbg:#113331;--mod:#baa8ff;--modbg:#262042;--gap:#f0ad4e;--gapbg:#33270f;--stop:#ff8a8f;--stopbg:#3a1a1c;color-scheme:dark}}
svg{font-family:Arial,Helvetica,sans-serif;background:var(--panel)}.b{stroke-width:1.5;fill:var(--panel);stroke:var(--line)}.b-model{fill:var(--modbg);stroke:var(--mod);stroke-width:2.5}.b-art{fill:var(--okbg);stroke:var(--ok)}
.b-hot{fill:var(--panel);stroke:var(--ok);stroke-width:2.5}.b-gap{fill:var(--gapbg);stroke:var(--gap);stroke-dasharray:6 4}.b-stop{fill:var(--stopbg);stroke:var(--stop)}
.fr{fill:none;stroke-width:1.5}.fr-proven{stroke:var(--ok)}.fr-gap{stroke:var(--gap);stroke-dasharray:6 4}.fr-plain{stroke:var(--rule)}
.frt{font:600 14px var(--disp);fill:var(--fg)}.frt-proven{fill:var(--ok)}.frt-gap{fill:var(--gap)}.frt-plain{fill:var(--muted)}
.t{font:600 13.5px var(--body);fill:var(--fg)}.tm{font:600 12.5px var(--mono);fill:var(--fg)}.s{font:12px var(--body);fill:var(--muted)}
.l{fill:none;stroke-width:1.5}.l-n{stroke:var(--line)}.l-hot{stroke:var(--ok);stroke-width:2.2}.l-gap{stroke:var(--gap);stroke-dasharray:5 4}
.ah{stroke:none}.ah-a{fill:var(--line)}.ah-h{fill:var(--ok)}.ah-g{fill:var(--gap)}
.lab{font:12px var(--body);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.lab-n{fill:var(--muted)}.lab-hot{fill:var(--ok);font-weight:600}.lab-gap{fill:var(--gap)}
</style><defs><marker id="f6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-a" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f6h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-h" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f6g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-g" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="b b-art" x="20" y="16" width="160" height="50" rx="3"/><text class="tm" x="100.0" y="37.5" text-anchor="middle">testplan.json</text><text class="s" x="100.0" y="53.5" text-anchor="middle">saved plan</text><rect class="b b-art" x="20" y="82" width="160" height="50" rx="3"/><text class="tm" x="100.0" y="103.5" text-anchor="middle">interface.json</text><text class="s" x="100.0" y="119.5" text-anchor="middle">ports, defines</text><rect class="b b-art" x="20" y="148" width="160" height="50" rx="3"/><text class="tm" x="100.0" y="169.5" text-anchor="middle">code_contract.json</text><text class="s" x="100.0" y="185.5" text-anchor="middle">from /code</text><rect class="b b-det" x="230" y="72" width="160" height="70" rx="3"/><text class="t" x="310.0" y="96.0" text-anchor="middle">Validate</text><text class="s" x="310.0" y="112.0" text-anchor="middle">quotes, ownership,</text><text class="s" x="310.0" y="127.0" text-anchor="middle">widths, routes</text><rect class="b b-det" x="430" y="72" width="160" height="70" rx="3"/><text class="t" x="510.0" y="96.0" text-anchor="middle">Render</text><text class="s" x="510.0" y="112.0" text-anchor="middle">fixed templates</text><text class="s" x="510.0" y="127.0" text-anchor="middle">no model call</text><rect class="b b-art" x="630" y="72" width="160" height="70" rx="3"/><text class="t" x="710.0" y="103.5" text-anchor="middle">Project</text><text class="s" x="710.0" y="119.5" text-anchor="middle">SV, UVM, compile.f</text><rect class="b b-det" x="830" y="72" width="140" height="70" rx="3"/><text class="t" x="900.0" y="103.5" text-anchor="middle">Xezim compile</text><text class="s" x="900.0" y="119.5" text-anchor="middle">UVM 2020.3.1</text><rect class="b b-det" x="1010" y="72" width="140" height="70" rx="3"/><text class="t" x="1080.0" y="103.5" text-anchor="middle">Run tests</text><text class="s" x="1080.0" y="119.5" text-anchor="middle">one seed per test</text><polyline class="l l-n" points="180,41 205,41 205,95 230,95" marker-end="url(#f6a)"/><polyline class="l l-n" points="180,107 230,107" marker-end="url(#f6a)"/><polyline class="l l-n" points="180,173 205,173 205,120 230,120" marker-end="url(#f6a)"/><polyline class="l l-n" points="390,107 430,107" marker-end="url(#f6a)"/><polyline class="l l-n" points="590,107 630,107" marker-end="url(#f6a)"/><polyline class="l l-n" points="790,107 830,107" marker-end="url(#f6a)"/><polyline class="l l-n" points="970,107 1010,107" marker-end="url(#f6a)"/><rect class="b b-art" x="1010" y="4" width="140" height="44" rx="3"/><text class="tm" x="1080.0" y="30.0" text-anchor="middle">regress.json</text><polyline class="l l-n" points="1080,72 1080,48" marker-end="url(#f6a)"/><rect class="b b-det" x="20" y="262" width="160" height="50" rx="3"/><text class="t" x="100.0" y="283.5" text-anchor="middle">Selected RTL</text><text class="s" x="100.0" y="299.5" text-anchor="middle">read only</text><polyline class="l l-n" points="180,287 850,287 850,142" marker-end="url(#f6a)"/><rect class="b b-stop" x="900" y="200" width="250" height="86" rx="3"/><text class="t" x="1025.0" y="224.5" text-anchor="middle">BLOCKED, never PASS</text><text class="s" x="1025.0" y="240.5" text-anchor="middle">inputs, RTL or sources changed</text><text class="s" x="1025.0" y="255.5" text-anchor="middle">simulator or UVM missing</text><text class="s" x="1025.0" y="270.5" text-anchor="middle">comparisons below the minimum</text><polyline class="l l-n" points="930,142 930,200" marker-end="url(#f6a)"/><polyline class="l l-n" points="1080,142 1080,200" marker-end="url(#f6a)"/></svg>
