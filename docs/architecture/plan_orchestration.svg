<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 390" role="img" aria-label="The plan flow runs five tools in a fixed order under budgets. The test plan step reads the index, the interface JSON and the RTL graph."><style>:root{--bg:#f2f6f7;--panel:#ffffff;--fg:#14232a;--muted:#51646d;--rule:#c7d3d8;--line:#3b4e57;
--ok:#006b66;--okbg:#def1ef;--mod:#5a3db3;--modbg:#ece8fa;--gap:#9c5300;--gapbg:#fbefdc;--stop:#a8262c;--stopbg:#fbe6e6;
--disp:Arial,Helvetica,sans-serif;--body:Arial,Helvetica,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f171b;--panel:#172329;--fg:#e2ebee;--muted:#9bb0b8;--rule:#2d3e46;--line:#9fb5be;
--ok:#55d1c5;--okbg:#113331;--mod:#baa8ff;--modbg:#262042;--gap:#f0ad4e;--gapbg:#33270f;--stop:#ff8a8f;--stopbg:#3a1a1c;color-scheme:dark}}
svg{font-family:Arial,Helvetica,sans-serif;background:var(--panel)}.b{stroke-width:1.5;fill:var(--panel);stroke:var(--line)}.b-model{fill:var(--modbg);stroke:var(--mod);stroke-width:2.5}.b-art{fill:var(--okbg);stroke:var(--ok)}
.b-hot{fill:var(--panel);stroke:var(--ok);stroke-width:2.5}.b-gap{fill:var(--gapbg);stroke:var(--gap);stroke-dasharray:6 4}.b-stop{fill:var(--stopbg);stroke:var(--stop)}
.fr{fill:none;stroke-width:1.5}.fr-proven{stroke:var(--ok)}.fr-gap{stroke:var(--gap);stroke-dasharray:6 4}.fr-plain{stroke:var(--rule)}
.frt{font:600 14px var(--disp);fill:var(--fg)}.frt-proven{fill:var(--ok)}.frt-gap{fill:var(--gap)}.frt-plain{fill:var(--muted)}
.t{font:600 13.5px var(--body);fill:var(--fg)}.tm{font:600 12.5px var(--mono);fill:var(--fg)}.s{font:12px var(--body);fill:var(--muted)}
.l{fill:none;stroke-width:1.5}.l-n{stroke:var(--line)}.l-hot{stroke:var(--ok);stroke-width:2.2}.l-gap{stroke:var(--gap);stroke-dasharray:5 4}
.ah{stroke:none}.ah-a{fill:var(--line)}.ah-h{fill:var(--ok)}.ah-g{fill:var(--gap)}
.lab{font:12px var(--body);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.lab-n{fill:var(--muted)}.lab-hot{fill:var(--ok);font-weight:600}.lab-gap{fill:var(--gap)}
</style><defs><marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-a" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f2h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-h" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-g" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="b b-det" x="20" y="12" width="200" height="44" rx="3"/><text class="t" x="120.0" y="38.0" text-anchor="middle">Specification files</text><rect class="b b-det" x="480" y="12" width="430" height="44" rx="3"/><text class="t" x="695.0" y="38.0" text-anchor="middle">Selected RTL files + defines from the request</text><rect class="fr fr-proven" x="10" y="76" width="1140" height="160" rx="3"/><text class="frt frt-proven" x="22" y="96"></text><text class="frt frt-proven" x="140" y="106" text-anchor="start">Orchestrator runner: testplan_flow.json</text><text class="s" x="830" y="106" text-anchor="start">2 attempts per step, 32 tool calls, 3600 s total</text><rect class="b b-det" x="20" y="130" width="200" height="70" rx="3"/><text class="tm" x="120.0" y="161.5" text-anchor="middle">spec_ingest</text><text class="s" x="120.0" y="177.5" text-anchor="middle">tool: dv_ingest</text><rect class="b b-det" x="250" y="130" width="200" height="70" rx="3"/><text class="tm" x="350.0" y="161.5" text-anchor="middle">spec_graph</text><text class="s" x="350.0" y="177.5" text-anchor="middle">tool: dv_build_graph</text><rect class="b b-det" x="480" y="130" width="200" height="70" rx="3"/><text class="tm" x="580.0" y="161.5" text-anchor="middle">rtl_ports</text><text class="s" x="580.0" y="177.5" text-anchor="middle">tool: rtl_extract</text><rect class="b b-det" x="710" y="130" width="200" height="70" rx="3"/><text class="tm" x="810.0" y="161.5" text-anchor="middle">rtl_graph</text><text class="s" x="810.0" y="177.5" text-anchor="middle">tool: rtl_build_graph</text><rect class="b b-model" x="940" y="130" width="200" height="70" rx="3"/><text class="tm" x="1040.0" y="161.5" text-anchor="middle">testplan</text><text class="s" x="1040.0" y="177.5" text-anchor="middle">tool: dv_testplan</text><polyline class="l l-n" points="220,165 250,165" marker-end="url(#f2a)"/><polyline class="l l-n" points="450,165 480,165" marker-end="url(#f2a)"/><polyline class="l l-n" points="680,165 710,165" marker-end="url(#f2a)"/><polyline class="l l-n" points="910,165 940,165" marker-end="url(#f2a)"/><polyline class="l l-n" points="120,56 120,130" marker-end="url(#f2a)"/><polyline class="l l-n" points="580,56 580,130" marker-end="url(#f2a)"/><polyline class="l l-n" points="810,56 810,130" marker-end="url(#f2a)"/><rect class="b b-art" x="20" y="262" width="200" height="58" rx="3"/><text class="tm" x="120.0" y="287.5" text-anchor="middle">dv/chunks.jsonl</text><text class="s" x="120.0" y="303.5" text-anchor="middle">text with exact offsets</text><polyline class="l l-n" points="120,200 120,262" marker-end="url(#f2a)"/><rect class="b b-art" x="250" y="262" width="200" height="58" rx="3"/><text class="tm" x="350.0" y="287.5" text-anchor="middle">dv/slim_index.json</text><text class="s" x="350.0" y="303.5" text-anchor="middle">lexical chunk index</text><polyline class="l l-n" points="350,200 350,262" marker-end="url(#f2a)"/><rect class="b b-art" x="480" y="262" width="200" height="58" rx="3"/><text class="tm" x="580.0" y="287.5" text-anchor="middle">rtl/interface_definition</text><text class="s" x="580.0" y="303.5" text-anchor="middle">ports, widths, defines</text><polyline class="l l-n" points="580,200 580,262" marker-end="url(#f2a)"/><rect class="b b-art" x="710" y="262" width="200" height="58" rx="3"/><text class="tm" x="810.0" y="287.5" text-anchor="middle">rtl_graph/rtl_graph.json</text><text class="s" x="810.0" y="303.5" text-anchor="middle">read by RTL observations</text><polyline class="l l-n" points="810,200 810,262" marker-end="url(#f2a)"/><rect class="b b-art" x="940" y="262" width="200" height="58" rx="3"/><text class="tm" x="1040.0" y="287.5" text-anchor="middle">dv/testplan_doc</text><text class="s" x="1040.0" y="303.5" text-anchor="middle">.json  .md  .html</text><polyline class="l l-n" points="1040,200 1040,262" marker-end="url(#f2a)"/><polyline class="l l-hot" points="1160,350 1160,165 1140,165" marker-end="url(#f2h)"/><polyline class="l l-hot" points="350,320 350,350 1160,350"/><polyline class="l l-hot" points="580,320 580,350"/><polyline class="l l-hot" points="810,320 810,350"/><text class="lab lab-hot" x="760" y="370" text-anchor="middle">all three are read by the testplan step</text></svg>
