575" y="198" width="130" height="66" rx="3"/><text class="t" x="640.0" y="227.5" text-anchor="middle">System coverage</text><text class="s" x="640.0" y="243.5" text-anchor="middle">interactions</text><polyline class="l l-n" points="235,264 235,316 900,316 900,264"/><polyline class="l l-n" points="485,316 485,264" marker-end="url(#f7a)"/><polyline class="l l-n" points="640,316 640,264" marker-end="url(#f7a)"/><text class="lab lab-n" x="300" y="332" text-anchor="middle">monitor analysis ports</text><rect class="b b-det" x="60" y="380" width="300" height="58" rx="3"/><text class="tm" x="210.0" y="405.5" text-anchor="middle">serial_link_if</text><text class="s" x="210.0" y="421.5" text-anchor="middle">serial pins</text><rect class="b b-det" x="450" y="380" width="240" height="58" rx="3"/><text class="t" x="570.0" y="405.5" text-anchor="middle">DUT</text><text class="s" x="570.0" y="421.5" text-anchor="middle">RTL unchanged</text><rect class="b b-det" x="810" y="380" width="310" height="58" rx="3"/><text class="tm" x="965.0" y="405.5" text-anchor="middle">register_bus_if</text><text class="s" x="965.0" y="421.5" text-anchor="middle">bus pins</text><polyline class="l l-n" points="102,264 102,380" marker-end="url(#f7a)"/><text class="lab lab-n" x="94" y="366" text-anchor="end">drives</text><polyline class="l l-n" points="195,380 195,264" marker-end="url(#f7a)"/><text class="lab lab-n" x="203" y="366" text-anchor="start">samples</text><polyline class="l l-n" points="1060,264 1060,380" marker-end="url(#f7a)"/><text class="lab lab-n" x="1068" y="366" text-anchor="start">drives</text><polyline class="l l-n" points="930,380 930,264" marker-end="url(#f7a)"/><text class="lab lab-n" x="938" y="366" text-anchor="start">samples</text><polyline class="l l-n" points="360,409 450,409" marker-end="url(#f7a)"/><polyline class="l l-n" points="690,409 810,409" marker-end="url(#f7a)"/><rect class="b b-det" x="450" y="452" width="240" height="46" rx="3"/><text class="tm" x="570.0" y="471.5" 