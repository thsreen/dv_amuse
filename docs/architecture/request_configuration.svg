<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 330" role="img" aria-label="A request is matched against macro names found in the RTL sources. One match becomes a define that drives extraction, the plan filter and the compile. Several matches block planning with a question."><style>:root{--bg:#f2f6f7;--panel:#ffffff;--fg:#14232a;--muted:#51646d;--rule:#c7d3d8;--line:#3b4e57;
--ok:#006b66;--okbg:#def1ef;--mod:#5a3db3;--modbg:#ece8fa;--gap:#9c5300;--gapbg:#fbefdc;--stop:#a8262c;--stopbg:#fbe6e6;
--disp:Arial,Helvetica,sans-serif;--body:Arial,Helvetica,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f171b;--panel:#172329;--fg:#e2ebee;--muted:#9bb0b8;--rule:#2d3e46;--line:#9fb5be;
--ok:#55d1c5;--okbg:#113331;--mod:#baa8ff;--modbg:#262042;--gap:#f0ad4e;--gapbg:#33270f;--stop:#ff8a8f;--stopbg:#3a1a1c;color-scheme:dark}}
svg{font-family:Arial,Helvetica,sans-serif;background:var(--panel)}.b{stroke-width:1.5;fill:var(--panel);stroke:var(--line)}.b-model{fill:var(--modbg);stroke:var(--mod);stroke-width:2.5}.b-art{fill:var(--okbg);stroke:var(--ok)}
.b-hot{fill:var(--panel);stroke:var(--ok);stroke-width:2.5}.b-gap{fill:var(--gapbg);stroke:var(--gap);stroke-dasharray:6 4}.b-stop{fill:var(--stopbg);stroke:var(--stop)}
.fr{fill:none;stroke-width:1.5}.fr-proven{stroke:var(--ok)}.fr-gap{stroke:var(--gap);stroke-dasharray:6 4}.fr-plain{stroke:var(--rule)}
.frt{font:600 14px var(--disp);fill:var(--fg)}.frt-proven{fill:var(--ok)}.frt-gap{fill:var(--gap)}.frt-plain{fill:var(--muted)}
.t{font:600 13.5px var(--body);fill:var(--fg)}.tm{font:600 12.5px var(--mono);fill:var(--fg)}.s{font:12px var(--body);fill:var(--muted)}
.l{fill:none;stroke-width:1.5}.l-n{stroke:var(--line)}.l-hot{stroke:var(--ok);stroke-width:2.2}.l-gap{stroke:var(--gap);stroke-dasharray:5 4}
.ah{stroke:none}.ah-a{fill:var(--line)}.ah-h{fill:var(--ok)}.ah-g{fill:var(--gap)}
.lab{font:12px var(--body);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.lab-n{fill:var(--muted)}.lab-hot{fill:var(--ok);font-weight:600}.lab-gap{fill:var(--gap)}
</style><defs><marker id="f4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-a" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f4h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-h" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-g" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="b b-det" x="20" y="45" width="160" height="58" rx="3"/><text class="t" x="100.0" y="70.5" text-anchor="middle">Request</text><text class="s" x="100.0" y="86.5" text-anchor="middle">“use the 8 bit version”</text><rect class="b b-det" x="20" y="150" width="160" height="58" rx="3"/><text class="t" x="100.0" y="175.5" text-anchor="middle">RTL sources</text><text class="s" x="100.0" y="191.5" text-anchor="middle">`ifdef, `define names</text><rect class="b b-det" x="225" y="95" width="150" height="62" rx="3"/><text class="tm" x="300.0" y="122.5" text-anchor="middle">resolve()</text><text class="s" x="300.0" y="138.5" text-anchor="middle">no design table</text><polyline class="l l-n" points="180,74 202,74 202,112 225,112" marker-end="url(#f4a)"/><polyline class="l l-n" points="180,179 202,179 202,140 225,140" marker-end="url(#f4a)"/><rect class="b b-det" x="445" y="14" width="170" height="58" rx="3"/><text class="t" x="530.0" y="39.5" text-anchor="middle">Several macros match</text><text class="s" x="530.0" y="55.5" text-anchor="middle">/plan blocked, question</text><rect class="b b-hot" x="445" y="97" width="170" height="58" rx="3"/><text class="t" x="530.0" y="122.5" text-anchor="middle">One match</text><text class="s" x="530.0" y="138.5" text-anchor="middle">DATA_BUS_WIDTH_8</text><rect class="b b-det" x="445" y="180" width="170" height="58" rx="3"/><text class="t" x="530.0" y="205.5" text-anchor="middle">No matching macro</text><text class="s" x="530.0" y="221.5" text-anchor="middle">plan unchanged</text><polyline class="l l-n" points="375,110 410,110 410,43 445,43" marker-end="url(#f4a)"/><polyline class="l l-hot" points="375,126 445,126" marker-end="url(#f4h)"/><polyline class="l l-n" points="375,142 410,142 410,209 445,209" marker-end="url(#f4a)"/><rect class="b b-det" x="655" y="97" width="150" height="58" rx="3"/><text class="t" x="730.0" y="122.5" text-anchor="middle">RTL extraction</text><text class="s" x="730.0" y="138.5" text-anchor="middle">ports + graph</text><polyline class="l l-hot" points="615,126 655,126" marker-end="url(#f4h)"/><rect class="b b-art" x="845" y="97" width="130" height="58" rx="3"/><text class="t" x="910.0" y="122.5" text-anchor="middle">Interface JSON</text><text class="s" x="910.0" y="138.5" text-anchor="middle">wb_dat_i 8, adr 3</text><polyline class="l l-hot" points="805,126 845,126" marker-end="url(#f4h)"/><rect class="b b-det" x="1005" y="14" width="150" height="72" rx="3"/><text class="t" x="1080.0" y="39.0" text-anchor="middle">Plan filter</text><text class="s" x="1080.0" y="55.0" text-anchor="middle">Debug 1, Debug 2 out</text><text class="s" x="1080.0" y="70.0" text-anchor="middle">BAUD_O out</text><rect class="b b-det" x="1005" y="166" width="150" height="72" rx="3"/><text class="t" x="1080.0" y="191.0" text-anchor="middle">Xezim compile</text><text class="s" x="1080.0" y="207.0" text-anchor="middle">same define</text><text class="s" x="1080.0" y="222.0" text-anchor="middle">no contract edit</text><polyline class="l l-hot" points="975,110 990,110 990,50 1005,50" marker-end="url(#f4h)"/><polyline class="l l-hot" points="975,142 990,142 990,202 1005,202" marker-end="url(#f4h)"/><rect class="b b-det" x="655" y="262" width="500" height="50" rx="3"/><text class="t" x="905.0" y="283.5" text-anchor="middle">Saved runs</text><text class="s" x="905.0" y="299.5" text-anchor="middle">a saved plan with a different define is not restored, so /code cannot reuse it</text><polyline class="l l-n" points="635,126 635,287 655,287" marker-end="url(#f4a)"/></svg>
