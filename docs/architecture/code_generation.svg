<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 640" role="img" aria-label="The code stage works in small checkpointed units: script-bound clock and reset, then interfaces smallest first, then features in dependency order, then tests, review, hooks and fixed templates."><style>:root{--bg:#f2f6f7;--panel:#ffffff;--fg:#14232a;--muted:#51646d;--rule:#c7d3d8;--line:#3b4e57;
--ok:#006b66;--okbg:#def1ef;--mod:#5a3db3;--modbg:#ece8fa;--gap:#9c5300;--gapbg:#fbefdc;--stop:#a8262c;--stopbg:#fbe6e6;
--disp:Arial,Helvetica,sans-serif;--body:Arial,Helvetica,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f171b;--panel:#172329;--fg:#e2ebee;--muted:#9bb0b8;--rule:#2d3e46;--line:#9fb5be;
--ok:#55d1c5;--okbg:#113331;--mod:#baa8ff;--modbg:#262042;--gap:#f0ad4e;--gapbg:#33270f;--stop:#ff8a8f;--stopbg:#3a1a1c;color-scheme:dark}}
svg{font-family:Arial,Helvetica,sans-serif;background:var(--panel)}.b{stroke-width:1.5;fill:var(--panel);stroke:var(--line)}.b-model{fill:var(--modbg);stroke:var(--mod);stroke-width:2.5}.b-art{fill:var(--okbg);stroke:var(--ok)}
.b-hot{fill:var(--panel);stroke:var(--ok);stroke-width:2.5}.b-gap{fill:var(--gapbg);stroke:var(--gap);stroke-dasharray:6 4}.b-stop{fill:var(--stopbg);stroke:var(--stop)}
.fr{fill:none;stroke-width:1.5}.fr-proven{stroke:var(--ok)}.fr-gap{stroke:var(--gap);stroke-dasharray:6 4}.fr-plain{stroke:var(--rule)}
.frt{font:600 14px var(--disp);fill:var(--fg)}.frt-proven{fill:var(--ok)}.frt-gap{fill:var(--gap)}.frt-plain{fill:var(--muted)}
.t{font:600 13.5px var(--body);fill:var(--fg)}.tm{font:600 12.5px var(--mono);fill:var(--fg)}.s{font:12px var(--body);fill:var(--muted)}
.l{fill:none;stroke-width:1.5}.l-n{stroke:var(--line)}.l-hot{stroke:var(--ok);stroke-width:2.2}.l-gap{stroke:var(--gap);stroke-dasharray:5 4}
.ah{stroke:none}.ah-a{fill:var(--line)}.ah-h{fill:var(--ok)}.ah-g{fill:var(--gap)}
.lab{font:12px var(--body);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.lab-n{fill:var(--muted)}.lab-hot{fill:var(--ok);font-weight:600}.lab-gap{fill:var(--gap)}
</style><defs><marker id="f5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-a" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f5h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-h" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-g" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="b b-art" x="20" y="20" width="190" height="60" rx="3"/><text class="t" x="115.0" y="46.5" text-anchor="middle">Plan + interface JSON</text><text class="s" x="115.0" y="62.5" text-anchor="middle">saved by /plan</text><rect class="b b-det" x="260" y="20" width="190" height="60" rx="3"/><text class="t" x="355.0" y="46.5" text-anchor="middle">Port comparison</text><text class="s" x="355.0" y="62.5" text-anchor="middle">spec against RTL</text><rect class="b b-det" x="500" y="20" width="190" height="60" rx="3"/><text class="t" x="595.0" y="46.5" text-anchor="middle">Independent audit</text><text class="s" x="595.0" y="62.5" text-anchor="middle">same inventory</text><rect class="b b-det" x="740" y="20" width="190" height="60" rx="3"/><text class="t" x="835.0" y="46.5" text-anchor="middle">Clock + reset binding</text><text class="s" x="835.0" y="62.5" text-anchor="middle">script, no model</text><rect class="b b-det" x="980" y="20" width="170" height="60" rx="3"/><text class="t" x="1065.0" y="46.5" text-anchor="middle">Common UVCs</text><text class="s" x="1065.0" y="62.5" text-anchor="middle">clock, reset, env</text><polyline class="l l-n" points="210,50 260,50" marker-end="url(#f5a)"/><polyline class="l l-n" points="450,50 500,50" marker-end="url(#f5a)"/><polyline class="l l-n" points="690,50 740,50" marker-end="url(#f5a)"/><polyline class="l l-n" points="930,50 980,50" marker-end="url(#f5a)"/><polyline class="l l-n" points="1065,80 1065,100 110,100 110,148" marker-end="url(#f5a)"/><rect class="fr fr-proven" x="20" y="114" width="1130" height="134" rx="3"/><text class="frt frt-proven" x="32" y="134"></text><text class="frt frt-proven" x="270" y="136" text-anchor="start">Each interface, fewest wires first</text><rect class="b b-det" x="40" y="148" width="190" height="66" rx="3"/><text class="t" x="135.0" y="177.5" text-anchor="middle">Scoped retrieval</text><text class="s" x="135.0" y="193.5" text-anchor="middle">plan items + sources</text><rect class="b b-model" x="260" y="148" width="190" height="66" rx="3"/><text class="t" x="355.0" y="177.5" text-anchor="middle">Interface base</text><text class="s" x="355.0" y="193.5" text-anchor="middle">ports, roles</text><rect class="b b-model" x="480" y="148" width="190" height="66" rx="3"/><text class="t" x="575.0" y="177.5" text-anchor="middle">Assess needs</text><text class="s" x="575.0" y="193.5" text-anchor="middle">what it must have</text><rect class="b b-model" x="700" y="148" width="190" height="66" rx="3"/><text class="t" x="795.0" y="177.5" text-anchor="middle">Build collateral</text><text class="s" x="795.0" y="193.5" text-anchor="middle">agent, driver, monitor</text><rect class="b b-det" x="920" y="148" width="190" height="66" rx="3"/><text class="t" x="1015.0" y="177.5" text-anchor="middle">Validate + save</text><text class="s" x="1015.0" y="193.5" text-anchor="middle">resumes from here</text><polyline class="l l-n" points="230,181 260,181" marker-end="url(#f5a)"/><polyline class="l l-n" points="450,181 480,181" marker-end="url(#f5a)"/><polyline class="l l-n" points="670,181 700,181" marker-end="url(#f5a)"/><polyline class="l l-n" points="890,181 920,181" marker-end="url(#f5a)"/><polyline class="l l-n" points="1015,214 1015,240 135,240 135,214" marker-end="url(#f5a)"/><text class="lab lab-n" x="575" y="234" text-anchor="middle">next interface</text><rect class="b b-model" x="40" y="268" width="300" height="56" rx="3"/><text class="t" x="190.0" y="292.5" text-anchor="middle">Group work</text><text class="s" x="190.0" y="308.5" text-anchor="middle">by interface or feature</text><rect class="b b-model" x="420" y="268" width="300" height="56" rx="3"/><text class="t" x="570.0" y="292.5" text-anchor="middle">Analyze dependencies</text><text class="s" x="570.0" y="308.5" text-anchor="middle">ordering, extension, shared settings</text><rect class="b b-art" x="800" y="268" width="330" height="56" rx="3"/><text class="t" x="965.0" y="292.5" text-anchor="middle">Execution waves</text><text class="s" x="965.0" y="308.5" text-anchor="middle">features ordered by what they need</text><polyline class="l l-n" points="340,296 420,296" marker-end="url(#f5a)"/><polyline class="l l-n" points="720,296 800,296" marker-end="url(#f5a)"/><polyline class="l l-n" points="135,248 135,268" marker-end="url(#f5a)"/><polyline class="l l-n" points="965,324 965,345 135,345 135,384" marker-end="url(#f5a)"/><rect class="fr fr-proven" x="20" y="350" width="1130" height="134" rx="3"/><text class="frt frt-proven" x="32" y="370"></text><text class="frt frt-proven" x="270" y="372" text-anchor="start">Each feature, in dependency order</text><rect class="b b-det" x="40" y="384" width="190" height="66" rx="3"/><text class="t" x="135.0" y="413.5" text-anchor="middle">Scoped retrieval</text><text class="s" x="135.0" y="429.5" text-anchor="middle">evidence + signatures</text><rect class="b b-model" x="260" y="384" width="190" height="66" rx="3"/><text class="t" x="355.0" y="413.5" text-anchor="middle">Pseudocode</text><text class="s" x="355.0" y="429.5" text-anchor="middle">steps and facts</text><rect class="b b-model" x="480" y="384" width="190" height="66" rx="3"/><text class="t" x="575.0" y="413.5" text-anchor="middle">Implement</text><text class="s" x="575.0" y="429.5" text-anchor="middle">typed components</text><rect class="b b-det" x="700" y="384" width="190" height="66" rx="3"/><text class="t" x="795.0" y="413.5" text-anchor="middle">Validate</text><text class="s" x="795.0" y="429.5" text-anchor="middle">script-owned rules</text><rect class="b b-art" x="920" y="384" width="190" height="66" rx="3"/><text class="t" x="1015.0" y="413.5" text-anchor="middle">Save fragment</text><text class="s" x="1015.0" y="429.5" text-anchor="middle">resumes from here</text><polyline class="l l-n" points="230,417 260,417" marker-end="url(#f5a)"/><polyline class="l l-n" points="450,417 480,417" marker-end="url(#f5a)"/><polyline class="l l-n" points="670,417 700,417" marker-end="url(#f5a)"/><polyline class="l l-n" points="890,417 920,417" marker-end="url(#f5a)"/><polyline class="l l-hot" points="795,384 795,366 575,366 575,384" marker-end="url(#f5h)"/><text class="lab lab-hot" x="685" y="360" text-anchor="middle">refuse + repair, bounded</text><polyline class="l l-n" points="1015,450 1015,476 135,476 135,450" marker-end="url(#f5a)"/><text class="lab lab-n" x="575" y="470" text-anchor="middle">next feature</text><rect class="b b-model" x="20" y="524" width="190" height="60" rx="3"/><text class="t" x="115.0" y="550.5" text-anchor="middle">Collate</text><text class="s" x="115.0" y="566.5" text-anchor="middle">all feature steps</text><rect class="b b-model" x="250" y="524" width="190" height="60" rx="3"/><text class="t" x="345.0" y="550.5" text-anchor="middle">Integrate</text><text class="s" x="345.0" y="566.5" text-anchor="middle">compose tests</text><rect class="b b-model" x="480" y="524" width="190" height="60" rx="3"/><text class="t" x="575.0" y="550.5" text-anchor="middle">Review</text><text class="s" x="575.0" y="566.5" text-anchor="middle">audit against facts</text><rect class="b b-model" x="710" y="524" width="190" height="60" rx="3"/><text class="t" x="805.0" y="550.5" text-anchor="middle">Hooks</text><text class="s" x="805.0" y="566.5" text-anchor="middle">declared slots only</text><rect class="b b-det" x="940" y="524" width="190" height="60" rx="3"/><text class="t" x="1035.0" y="550.5" text-anchor="middle">Render</text><t