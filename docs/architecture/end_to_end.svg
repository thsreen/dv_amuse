<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 470" role="img" aria-label="A one-line request selects the RTL configuration. /plan produces a cited test plan, /code turns it into a UVM testbench, and /run compiles and simulates it for engineer review."><style>:root{--bg:#f2f6f7;--panel:#ffffff;--fg:#14232a;--muted:#51646d;--rule:#c7d3d8;--line:#3b4e57;
--ok:#006b66;--okbg:#def1ef;--mod:#5a3db3;--modbg:#ece8fa;--gap:#9c5300;--gapbg:#fbefdc;--stop:#a8262c;--stopbg:#fbe6e6;
--disp:Arial,Helvetica,sans-serif;--body:Arial,Helvetica,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f171b;--panel:#172329;--fg:#e2ebee;--muted:#9bb0b8;--rule:#2d3e46;--line:#9fb5be;
--ok:#55d1c5;--okbg:#113331;--mod:#baa8ff;--modbg:#262042;--gap:#f0ad4e;--gapbg:#33270f;--stop:#ff8a8f;--stopbg:#3a1a1c;color-scheme:dark}}
svg{font-family:Arial,Helvetica,sans-serif;background:var(--panel)}.b{stroke-width:1.5;fill:var(--panel);stroke:var(--line)}.b-model{fill:var(--modbg);stroke:var(--mod);stroke-width:2.5}.b-art{fill:var(--okbg);stroke:var(--ok)}
.b-hot{fill:var(--panel);stroke:var(--ok);stroke-width:2.5}.b-gap{fill:var(--gapbg);stroke:var(--gap);stroke-dasharray:6 4}.b-stop{fill:var(--stopbg);stroke:var(--stop)}
.fr{fill:none;stroke-width:1.5}.fr-proven{stroke:var(--ok)}.fr-gap{stroke:var(--gap);stroke-dasharray:6 4}.fr-plain{stroke:var(--rule)}
.frt{font:600 14px var(--disp);fill:var(--fg)}.frt-proven{fill:var(--ok)}.frt-gap{fill:var(--gap)}.frt-plain{fill:var(--muted)}
.t{font:600 13.5px var(--body);fill:var(--fg)}.tm{font:600 12.5px var(--mono);fill:var(--fg)}.s{font:12px var(--body);fill:var(--muted)}
.l{fill:none;stroke-width:1.5}.l-n{stroke:var(--line)}.l-hot{stroke:var(--ok);stroke-width:2.2}.l-gap{stroke:var(--gap);stroke-dasharray:5 4}
.ah{stroke:none}.ah-a{fill:var(--line)}.ah-h{fill:var(--ok)}.ah-g{fill:var(--gap)}
.lab{font:12px var(--body);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}.lab-n{fill:var(--muted)}.lab-hot{fill:var(--ok);font-weight:600}.lab-gap{fill:var(--gap)}
</style><defs><marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-a" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f1h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-h" d="M0 0 L10 5 L0 10 z"/></marker><marker id="f1g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ah-g" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="b b-det" x="20" y="90" width="130" height="60" rx="3"/><text class="t" x="85.0" y="116.5" text-anchor="middle">Request</text><text class="s" x="85.0" y="132.5" text-anchor="middle">“8 bit version”</text><rect class="b b-det" x="20" y="195" width="130" height="60" rx="3"/><text class="t" x="85.0" y="221.5" text-anchor="middle">Specification</text><text class="s" x="85.0" y="237.5" text-anchor="middle">documents</text><rect class="b b-det" x="20" y="300" width="130" height="60" rx="3"/><text class="t" x="85.0" y="326.5" text-anchor="middle">RTL sources</text><text class="s" x="85.0" y="342.5" text-anchor="middle">read only</text><rect class="fr fr-proven" x="175" y="60" width="300" height="395" rx="3"/><text class="frt frt-proven" x="187" y="80">/plan</text><rect class="fr fr-proven" x="500" y="60" width="320" height="395" rx="3"/><text class="frt frt-proven" x="512" y="80">/code</text><rect class="fr fr-proven" x="845" y="60" width="305" height="395" rx="3"/><text class="frt frt-proven" x="857" y="80">/run</text><rect class="b b-det" x="195" y="95" width="260" height="60" rx="3"/><text class="t" x="325.0" y="121.5" text-anchor="middle">Select configuration</text><text class="s" x="325.0" y="137.5" text-anchor="middle">compile defines</text><rect class="b b-det" x="195" y="200" width="260" height="60" rx="3"/><text class="t" x="325.0" y="226.5" text-anchor="middle">Ingest and extract</text><text class="s" x="325.0" y="242.5" text-anchor="middle">chunks, ports, RTL graph</text><rect class="b b-model" x="195" y="305" width="260" height="60" rx="3"/><text class="t" x="325.0" y="331.5" text-anchor="middle">Generate test plan</text><text class="s" x="325.0" y="347.5" text-anchor="middle">13 cited sections</text><polyline class="l l-n" points="325,155 325,200" marker-end="url(#f1a)"/><polyline class="l l-n" points="325,260 325,305" marker-end="url(#f1a)"/><polyline class="l l-n" points="150,120 195,120" marker-end="url(#f1a)"/><polyline class="l l-n" points="150,225 195,225" marker-end="url(#f1a)"/><polyline class="l l-n" points="150,330 172,330 172,245 195,245" marker-end="url(#f1a)"/><rect class="b b-det" x="520" y="95" width="280" height="56" rx="3"/><text class="t" x="660.0" y="119.5" text-anchor="middle">Clock, reset, common UVCs</text><text class="s" x="660.0" y="135.5" text-anchor="middle">bound by script</text><rect class="b b-model" x="520" y="167" width="280" height="56" rx="3"/><text class="t" x="660.0" y="191.5" text-anchor="middle">Interfaces</text><text class="s" x="660.0" y="207.5" text-anchor="middle">fewest wires first</text><rect class="b b-model" x="520" y="239" width="280" height="56" rx="3"/><text class="t" x="660.0" y="263.5" text-anchor="middle">Features</text><text class="s" x="660.0" y="279.5" text-anchor="middle">dependency order</text><rect class="b b-model" x="520" y="311" width="280" height="56" rx="3"/><text class="t" x="660.0" y="335.5" text-anchor="middle">Collate, integrate, review</text><text class="s" x="660.0" y="351.5" text-anchor="middle">tests from the features</text><rect class="b b-det" x="520" y="383" width="280" height="56" rx="3"/><text class="t" x="660.0" y="407.5" text-anchor="middle">Render</text><text class="s" x="660.0" y="423.5" text-anchor="middle">fixed templates</text><polyline class="l l-n" points="660,151 660,167" marker-end="url(#f1a)"/><polyline class="l l-n" points="660,223 660,239" marker-end="url(#f1a)"/><polyline class="l l-n" points="660,295 660,311" marker-end="url(#f1a)"/><polyline class="l l-n" points="660,367 660,383" marker-end="url(#f1a)"/><rect class="b b-det" x="865" y="95" width="265" height="60" rx="3"/><text class="t" x="997.5" y="121.5" text-anchor="middle">Xezim compile</text><text class="s" x="997.5" y="137.5" text-anchor="middle">SV, UVM and RTL</text><rect class="b b-det" x="865" y="200" width="265" height="60" rx="3"/><text class="t" x="997.5" y="226.5" text-anchor="middle">UVM simulation</text><text class="s" x="997.5" y="242.5" text-anchor="middle">seeded tests</text><rect class="b b-art" x="865" y="305" width="265" height="60" rx="3"/><text class="t" x="997.5" y="331.5" text-anchor="middle">Evidence</text><text class="s" x="997.5" y="347.5" text-anchor="middle">logs, coverage, scoreboard</text><polyline class="l l-n" points="997,155 997,200" marker-end="url(#f1a)"/><polyline class="l l-n" points="997,260 997,305" marker-end="url(#f1a)"/><rect class="b b-hot" x="865" y="395" width="265" height="46" rx="3"/><text class="t" x="997.5" y="414.5" text-anchor="middle">Engineer review</text><text class="s" x="997.5" y="430.5" text-anchor="middle">authoritative sign-off</text><polyline class="l l-n" points="997,365 997,395" marker-end="url(#f1a)"/><polyline class="l l-n" points="455,335 487,335 487,123 520,123" marker-end="url(#f1a)"/><text class="lab lab-n" x="487" y="382" text-anchor="middle">plan + ports</text><polyline class="l l-n" points="800,411 832,411 832,125 865,125" marker-end="url(#f1a)"/><text class="lab lab-n" x="832" y="424" text-anchor="middle">SV project</text><polyline class="l l-hot" points="325,95 325,32 997,32 997,95" marker-end="url(#f1h)"/><text class="lab lab-hot" x="660" y="24" text-anchor="middle">the same defines reach the compile</text></svg>
