[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dv_agent"
version = "0.1.0"
license = { file = "LICENSE" }
description = "Design-verification agent: from a specification and RTL to a cited test plan, a UVM testbench and simulation results"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6",
  "networkx>=3.3",
  "pydantic>=2.7",
  "openai>=2",
  "langfuse>=3",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dv-agent = "dv_agent.cli:main"
rtl-agent = "rtl_agent.cli:main"
orchestrate-agent = "orchestrator_agent.cli:main"
orchestrate = "orchestrator_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtl_agent = ["templates/*.json", "templates/*.jsonc"]
dv_agent = ["templates/*.json", "templates/*.sha256", "uvc/*/*.sv", "uvc/*/*.svh",
            "templates/codegen/*.json", "templates/codegen/*.tmpl",
            "templates/uvm_agent/*.json", "templates/uvm_agent/*.tmpl", "templates/uvm_agent/*.md"]
orchestrator_agent = ["flows/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Meta API or Langfuse; needs keys and is skipped by default"]
addopts = "-m 'not live'"
